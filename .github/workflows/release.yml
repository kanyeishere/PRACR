name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.5.2.2"
        required: true
        default: "1.0.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  AUTHOR: Miruku
  NAME: PromeRotation
  PUNCHLINE: 雨露霜雪
  DESCRIPTION: An advanced combat rotation platform for FFXIV high-end content.
  INTERNAL_NAME: PromeRotation
  DALAMUD_API_LEVEL: "15"
  ICON_URL: https://vip.123pan.cn/1830059912/PromeRotation/prome.png
  TAGS: '["combat","rotation","prome"]'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }

          $parsedVersion = $null
          if (-not [System.Version]::TryParse($version, [ref]$parsedVersion)) {
            throw "Version '$version' is not a valid System.Version value. Use a tag like v1.5.2.2."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check reference DLLs
        shell: pwsh
        run: |
          $required = @(
            "Dalamud.dll",
            "Dalamud.Bindings.ImGui.dll",
            "FFXIVClientStructs.dll",
            "Lumina.dll",
            "Lumina.Excel.dll",
            "ECommons.dll",
            "PromeRotation.dll"
          )

          $missing = $required | Where-Object { -not (Test-Path "lib/$_") }
          if ($missing.Count -gt 0) {
            throw "Missing reference DLLs in lib/: $($missing -join ', ')"
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build Wotou.csproj `
            --configuration Release `
            -p:OutputPath="${{ runner.temp }}\publish\" `
            -p:AppendTargetFrameworkToOutputPath=false `
            -p:DalamudReferenceRoot="${{ github.workspace }}\lib" `
            -p:PromeRotationReferenceRoot="${{ github.workspace }}\lib"

      - name: Package zip
        shell: pwsh
        run: |
          $publish = "${{ runner.temp }}\publish"
          $dist = "${{ runner.temp }}\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Compress-Archive `
            -Path "$publish\Wotou.dll", "$publish\Wotou.deps.json" `
            -DestinationPath "$dist\latest.zip" `
            -Force

      - name: Generate repo json
        shell: pwsh
        run: |
          $dist = "${{ runner.temp }}\dist"
          $zipUrl = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
          $manifest = @(
            [ordered]@{
              Author = "${{ env.AUTHOR }}"
              Name = "${{ env.NAME }}"
              Punchline = "${{ env.PUNCHLINE }}"
              Description = "${{ env.DESCRIPTION }}"
              InternalName = "${{ env.INTERNAL_NAME }}"
              AssemblyVersion = "${{ steps.version.outputs.version }}"
              ApplicableVersion = "any"
              DalamudApiLevel = [int]"${{ env.DALAMUD_API_LEVEL }}"
              IsHide = $false
              IconUrl = "${{ env.ICON_URL }}"
              DownloadLinkInstall = $zipUrl
              DownloadLinkUpdate = $zipUrl
              DownloadCount = 114514
              LastUpdate = 0
              Tags = ConvertFrom-Json '${{ env.TAGS }}'
            }
          )

          $manifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -Path "$dist\repo.json" -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ runner.temp }}\dist\latest.zip
            ${{ runner.temp }}\dist\repo.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            ${{ runner.temp }}\dist\latest.zip
            ${{ runner.temp }}\dist\repo.json
